server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API is proxied rather than called cross-origin, mirroring what the
    # Vite dev server does. Same-origin either way, so the backend needs no
    # CORS middleware in development or in the container stack.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router owns the URL space, so any path that is not a real file has
    # to fall through to index.html or a refresh on /lots/3 would 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints asset filenames, so they can be cached indefinitely.
    # index.html must not be, or a deploy would keep serving the old bundle.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
