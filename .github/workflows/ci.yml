name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: westguard
          POSTGRES_PASSWORD: westguard
          POSTGRES_DB: westguardqc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U westguard -d westguardqc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://westguard:westguard@localhost:5432/westguardqc_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (mypy)
        run: mypy app tests

      # Must run before pytest, which rebuilds the schema from the models with
      # create_all. `check` fails if the models have drifted from the
      # migrations, which the test suite would otherwise never notice.
      - name: Migrations (alembic)
        run: |
          alembic upgrade head
          alembic check

      - name: Test (pytest)
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Test (vitest)
        run: npm test

      - name: Build (tsc + vite)
        run: npm run build
